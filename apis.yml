name: Flowneuroscience
description: 'Flow Neuroscience is a Malmo, Sweden medtech company founded in 2016
  by clinical psychologist Daniel Mansson and neuroscientist Erik Rehn. It develops
  a medically approved, at-home transcranial direct current stimulation (tDCS) headset
  paired with a behavioral-therapy smartphone app to treat major depressive disorder
  without medication. Its Flow FL-100 device is CE-marked in the EU and UK and received
  FDA approval (PMA P230024) as the first at-home tDCS treatment for depression, with
  a US launch planned for September 2026. Flow is backed by Khosla Ventures and other
  global investors. This is a consumer and clinical medical-device company; no public
  developer API, OpenAPI, or developer portal was found during enrichment.'
